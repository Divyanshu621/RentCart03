databases:
  - name: rentcart-db
    plan: free
    databaseName: rentcart
    user: rentcart_user

services:
  - type: web
    name: rentcart
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: bash start.sh
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: rentcart-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        value: https://rentcart03.onrender.com
      - key: APP_URL
        value: https://rentcart03.onrender.com
